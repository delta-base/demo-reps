const decodeLiteralCheckout=()=>new TextDecoder().decode(Uint8Array.from(atob(literalCheckoutSource),c=>c.charCodeAt(0)));
const button=(text='Continue',disabled=true)=>`<button class="action" ${disabled?'disabled':''} onclick="next()">${text}</button>`;
const select=(key,items,multi=false)=>{const n=state[key]?.length||0;return `<div class="choices">${items.map(x=>`<button class="choice ${state[key]?.includes(x)?'selected':''}" aria-pressed="${state[key]?.includes(x)?'true':'false'}" data-key="${key}" data-value="${encodeURIComponent(x)}" data-multi="${multi}" onclick="pick(this.dataset.key,decodeURIComponent(this.dataset.value),this.dataset.multi==='true')">${x}</button>`).join('')}</div>${['goals','priority'].includes(key)?'':button('Continue',!n)}`;};
const question=(title,key,items)=>`${brand}<h1>${title}</h1>${select(key,items)}`;
const analysis=(q,percent)=>`${brand}<h1>We are personalizing your training plan.</h1><div class="progress"><label>Analysing your answers</label><div class="bar"><i id="fill" style="width:${percent[0]}%"></i></div></div><div class="floating"><div class="eyebrow">To improve recommendations, specify</div><h2>${q}</h2><div class="yesno"><button data-key="${encodeURIComponent(q)}" onclick="pick(decodeURIComponent(this.dataset.key),'No')">No</button><button data-key="${encodeURIComponent(q)}" onclick="pick(decodeURIComponent(this.dataset.key),'Yes')">Yes</button></div></div>`;
const screens=[
()=>`${brand}<h1>Personalized Training Plan</h1><p>This negotiation simulator creates realistic practice, recognises observable behaviour, judges it consistently against explicit standards, and converts that evidence into your next useful practice intervention.</p><div class="trust intro-trust"><span class="stars">★★★★★</span> &nbsp;<b>4.4</b> on Trustpilot</div><h2 class="intro-selection-title">Select your gender &amp; age:</h2><div class="option-grid"><button class="option male-carousel" type="button" onclick="pick('gender','Male')" aria-label="Male age-group portrait carousel. Click to continue to the next slide."><span class="male-carousel-images" aria-hidden="true"><img class="is-active" src="imgs/male-carousel.gif" alt=""></span><b>Male</b></button><button class="option female-carousel" type="button" onclick="pick('gender','Female')" aria-label="Female age-group portrait carousel. Click to continue to the next slide."><span class="female-carousel-images" aria-hidden="true"><img class="is-active" src="imgs/female-carousel.gif" alt=""></span><b>Female</b></button><button class="option option-private" onclick="pick('gender','Rather not reveal')"><b>Rather not reveal</b></button></div><div class="hint">By using this platform, you agree to the <a href="https://reps.be/legal/Terms-of-Use.mhtml" target="_blank" rel="noopener noreferrer">Terms of Use</a> and <a href="https://reps.be/legal/Privacy-CookiePolicy.mhtml" target="_blank" rel="noopener noreferrer">Privacy &amp;</a> <a href="https://reps.be/legal/Privacy-CookiePolicy.mhtml" target="_blank" rel="noopener noreferrer">Cookie Policy</a>.</div>`,
()=>`${brand}<h1>Deliberate practice creates<br>measurable confidence &amp; success.</h1><div class="metric-grid"><div class="metric"><strong>84%</strong>of users feel less anxious when closing the deal on purpose</div><div class="metric"><strong>76%</strong>of users notice improved consultative, Challenging and Sales Empathy skills</div><div class="metric"><strong>91%</strong>say short practice makes difficult conversations easier</div></div><div class="quote">“A focused practice rhythm transformed how confidently I show up in buyer conversations.” — Verified review</div>${button('Continue',false)}`,
()=>question('What would you like to improve?','goals',['Clarify needs & wants through consultative selling','Feel more confident in closing deal','Develop a stronger gap analysis','Become more persuasive','Smoothly overcome objections']),
()=>`${brand}<h1>You’re making progress already!</h1><img class="pyramid-reference" src="imgs/success-pyramid.webp" alt="Success pyramid: clear goals form a personal plan, which enables deliberate practice and success."><p>Small focused repetitions turn clear goals into reliable successful behaviour.</p>${button('Continue',false)}`,
()=>question('Which sales priority matters most right now?','priority',['Create more value before discussing price','Gain confidence in closing','Handle objections calmly','Protect margin','Open stronger discovery conversations']),
()=>`${brand}<div class="eyebrow">Communication challenge</div><h1>I can ask questions that uncover the real business need.</h1><div class="scale">${['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'].map(x=>`<button onclick="pick('challenge',this.textContent)" class="${state.challenge?.includes(x)?'selected':''}">${x}</button>`).join('')}</div>${button('Continue',!state.challenge)}`,
()=>`${brand}<div class="eyebrow">After the conversation</div><h1>I reflect on what worked and what I will try next time.</h1><div class="scale">${['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'].map(x=>`<button onclick="pick('reflection',this.textContent)" class="${state.reflection?.includes(x)?'selected':''}">${x}</button>`).join('')}</div>${button('Continue',!state.reflection)}`,
()=>`${brand}<h1>How to master your learning plateau?</h1><img class="learning-plateau-gif" src="imgs/learning-plateau.webp" alt="Animated learning curve showing progress through learning plateaus" style="display:block;width:min(650px,100%);height:auto;object-fit:contain;margin:12px auto 27px;border-radius:20px"><div class="quote">Progress is not always visible. Deliberate practice keeps you moving through the plateau.</div>${button('Continue',false)}`,
()=>question('Goals','time',['5 min/day','10 min/day','15 min/day','20+ min/day']),
()=>analysis('Do you self-reflect?',[0,50]),()=>analysis('Do you need a friendly push when things get hard?',[50,100]),
()=>analysis('Do you believe deliberate practice is crucial for effective learning?',[70,100]),()=>analysis('Are you inclined to finish what you start?',[90,100]),
()=>`${brand}<h1>We are personalizing your training plan.</h1><div class="plan-progress">${['Analysing your answers','Adapting to your triggers','Facilitating your goal setting','Personalizing your training plan'].map((label,index)=>`<div class="progress"><label><span>${label}</span><b class="progress-status" ${index===3?'id="plan-percent"':''}>${index===3?'0%':''}</b></label><div class="bar" role="progressbar" aria-label="${label}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i ${index===3?'id="plan-fill"':''} style="width:0%"></i></div></div>`).join('')}</div><div class="quote">“It feels like a plan that understands how I learn, not just what I should learn.” — Trustpilot review</div>`,

()=>`${brand}<h1>Choose your practice plan</h1><div class="plans"><button class="plan" onclick="choosePlan(this)"><b>4 weeks</b><strong><del>€99.98</del> €49.99</strong><span>€1.79/day</span></button><button class="plan popular" onclick="choosePlan(this)"><div class="tag">MOST POPULAR</div><b>3 months</b><strong><del>€149.97</del> €99.99</strong><span>€1.11/day<br>Save 33%</span></button><button class="plan" onclick="choosePlan(this)"><div class="tag">BEST VALUE</div><b>1 year</b><strong><del>€649.87</del> €249.99</strong><span>€0.68/day<br>Save 62%</span></button></div><button class="action" onclick="openCheckout()">Continue to checkout</button>`,()=>'<div id="checkout-host"></div>'];
let maleCarouselIndex=0,maleCarouselTimer;
function updateMaleCarousel(){const images=[...document.querySelectorAll(".male-carousel-images img")];if(!images.length)return;images.forEach((image,index)=>image.classList.toggle("is-active",index===maleCarouselIndex));}
function advanceMaleCarousel(event){if(event)event.stopPropagation();const images=document.querySelectorAll(".male-carousel-images img");if(!images.length)return;maleCarouselIndex=(maleCarouselIndex+1)%images.length;updateMaleCarousel();clearInterval(maleCarouselTimer);maleCarouselTimer=setInterval(advanceMaleCarousel,2000);}
function initMaleCarousel(){clearInterval(maleCarouselTimer);maleCarouselIndex=0;updateMaleCarousel();if(document.querySelector(".male-carousel-images"))maleCarouselTimer=setInterval(advanceMaleCarousel,2000);}
let femaleCarouselIndex=0,femaleCarouselTimer;
function updateFemaleCarousel(){const images=[...document.querySelectorAll(".female-carousel-images img")];if(!images.length)return;images.forEach((image,index)=>image.classList.toggle("is-active",index===femaleCarouselIndex));}
function advanceFemaleCarousel(){const images=document.querySelectorAll(".female-carousel-images img");if(!images.length)return;femaleCarouselIndex=(femaleCarouselIndex+1)%images.length;updateFemaleCarousel();}
function initFemaleCarousel(){clearInterval(femaleCarouselTimer);femaleCarouselIndex=0;updateFemaleCarousel();if(document.querySelector(".female-carousel-images"))femaleCarouselTimer=setInterval(advanceFemaleCarousel,2000);}
function render(){clearTimeout(autoNextTimer);clearInterval(planProgressTimer);const app=document.getElementById('app');const progressValues=[3,7,12,16,23,27,32,36,47,55,63,70,78,85,93,97];const progress=step<=15?`<div class="slide-progress" role="progressbar" aria-label="Onboarding progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progressValues[step]}"><span style="width:${progressValues[step]}%"></span></div>`:'';app.innerHTML=screens[step]()+progress+`<button class="nav-back" onclick="prev()" ${step===0?'disabled':''}>← Back</button>`; layoutNavigation(app); initMaleCarousel(); initFemaleCarousel(); if(document.getElementById('checkout-host'))mountLiteralCheckout(); const f=document.getElementById('fill');if(f)setTimeout(()=>f.style.width=(step===9?'50':step===10?'100':'100')+'%',120);if(step===13)animatePlanProgress();}
function animatePlanProgress(){
  const rows=[...document.querySelectorAll('.plan-progress .progress')];
  const started=performance.now();
  planProgressTimer=setInterval(()=>{
    const elapsed=performance.now()-started;
    rows.forEach((row,index)=>{
      const value=Math.floor(Math.max(0,Math.min(1,(elapsed-index*950)/(index===3?1200:850)))*(index===3?99:100));
      row.querySelector('i').style.width=value+'%';
      row.querySelector('.bar').setAttribute('aria-valuenow',value);
      row.querySelector('.progress-status').textContent=index===3?value+'%':value===100?'✓':'';
    });
    if(elapsed>=4050){clearInterval(planProgressTimer);autoNextTimer=setTimeout(next,800);}
  },30);
}
function layoutNavigation(app){
  const footer=document.createElement('nav');
  footer.className='slide-navigation';footer.setAttribute('aria-label','Slide navigation');
  const back=app.querySelector(':scope > .nav-back');
  const forward=app.querySelector(':scope > .action');
  if(back){if(step===0)back.remove();else footer.appendChild(back);}
  if(forward){if([2,4,5,6,8,9,10,11,12,13].includes(step))forward.remove();else{forward.textContent=forward.textContent.replace(/\s*→$/,'')+' →';footer.appendChild(forward);}}
  const progress=app.querySelector(':scope > .slide-progress');
  if(progress)footer.insertBefore(progress,footer.querySelector('.action'));
  if(footer.children.length)app.appendChild(footer);
}
function next(){if(step<screens.length-1){step++;render()}}
function openCheckout(){step=screens.length-1;render()}
function prev(){if(step>0){step--;render()}}
function pick(key,value,multi=false){if(multi){let a=state[key]||[];state[key]=a.includes(value)?a.filter(x=>x!==value):[...a,value]}else state[key]=[value];if(['gender','goals','priority'].includes(key)||[2,4,5,6,8,9,10,11,12].includes(step))next();else if(key.startsWith('Do you')||key.startsWith('Are you'))next();else render()}
function emailCheck(input){state.email=input.value.trim();const b=document.querySelector('.action');b.disabled=!input.validity.valid}
function choosePlan(el){document.querySelectorAll('.plan').forEach(x=>x.classList.remove('popular'));el.classList.add('popular');state.plan=el.querySelector('b').textContent}
function choosePayment(el){document.querySelectorAll('.payment').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function selectCheckoutMethod(el){document.querySelectorAll('.checkout-method,.native-wallet').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function finishCheckout(el){el.textContent='Checkout ready ✓';el.disabled=true}
function mountLiteralCheckout(){
  const host=document.getElementById('checkout-host');if(!host)return;
  const sourceDoc=new DOMParser().parseFromString(decodeLiteralCheckout(),'text/html');
  const sourceStyle=sourceDoc.querySelector('style').textContent;
  const originalScript=sourceDoc.querySelector('script').textContent;
  sourceDoc.querySelectorAll('script').forEach(node=>node.remove());
  host.innerHTML='<style>'+sourceStyle+'</style>'+sourceDoc.body.innerHTML;
  // Run the supplied checkout logic unchanged, scoped to its native tile.
  const checkoutDocument={
    getElementById:id=>host.querySelector('[id="'+id+'"]'),
    querySelector:selector=>host.querySelector(selector),
    querySelectorAll:selector=>host.querySelectorAll(selector),
    addEventListener:(...args)=>host.addEventListener(...args)
  };
  if(state.email){
    checkoutDocument.getElementById('accountEmail').textContent=state.email;
    checkoutDocument.getElementById('accountEmailInput').value=state.email;
  }
  new Function('document','window',originalScript)(checkoutDocument,window);
  const offers={'4 weeks':[49.99,99.98,'4 weeks'],'3 months':[99.99,149.97,'3 months'],'1 year':[249.99,649.87,'year']};
  host.querySelectorAll('.mini-plan').forEach(button=>{
    const offer=offers[button.dataset.name];
    if(offer){
      button.dataset.price=offer[0];button.dataset.renewal=offer[1];button.dataset.cycle=offer[2];
    }
    button.addEventListener('click',()=>{
      state.plan=button.dataset.name;
      host.querySelector('#new h1').textContent=state.plan+' of deliberate practice.';
      host.querySelector('#new .badge').textContent={'4 weeks':'LAUNCH OFFER','3 months':'MOST POPULAR · LAUNCH OFFER','1 year':'BEST VALUE · LAUNCH OFFER'}[state.plan];
    });
  });
  const selected=[...host.querySelectorAll('.mini-plan')].find(button=>button.dataset.name===(state.plan||'3 months'));
  if(selected)selected.click();
  host.querySelector('#saveAccountEdit').addEventListener('click',()=>{
    if(!host.querySelector('#emailValidation').classList.contains('show'))
      state.email=host.querySelector('#accountEmailInput').value.trim();
  });
}
render();
</script></body></html>
