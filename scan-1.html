<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>REPS · Sales Excellence Scan</title>
<style>
:root{
  --bg:#F6F9FB;--panel:#fff;--ink:#202A33;--muted:#667684;--line:#D9E3E9;
  --accent:#2F6B8A;--accent-dark:#183F56;--accent-light:#C5DFED;--soft:#EAF3F8;
  --success:#3A7D5B;--radius:22px;--shadow:0 18px 50px rgba(31,41,51,.08);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#F8FBFC,#EDF3F6);color:var(--ink);min-height:100vh}
button{font:inherit}
.shell{max-width:1180px;margin:auto;padding:24px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;letter-spacing:-.02em;color:var(--accent-dark)}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent-dark);color:#fff;font-size:20px;box-shadow:0 9px 22px rgba(24,63,86,.16)}
.lang-toggle{display:flex;padding:4px;background:#EAF0F4;border:1px solid var(--line);border-radius:999px}
.lang-btn{border:0;background:transparent;color:var(--muted);font-weight:900;padding:8px 13px;border-radius:999px;cursor:pointer}
.lang-btn.active{background:#fff;color:var(--accent-dark);box-shadow:0 2px 8px rgba(31,41,51,.08)}
.top-actions{display:flex;align-items:center;gap:10px}
.screen{display:none}.screen.active{display:block}
.card{background:var(--panel);border:1px solid rgba(217,227,233,.92);border-radius:var(--radius);box-shadow:var(--shadow)}
.eyebrow{font-size:12px;line-height:1.2;font-weight:900;letter-spacing:.13em;color:var(--accent);text-transform:uppercase}
h1,h2,h3,p{margin-top:0}h2{font-size:clamp(34px,4vw,54px);line-height:1.04;letter-spacing:-.045em;margin:12px 0 18px}p{color:var(--muted);font-size:17px;line-height:1.65}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:900;cursor:pointer;background:var(--accent-dark);color:#fff;transition:transform .15s ease,box-shadow .15s ease,opacity .15s ease}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(24,63,86,.16)}
.btn.secondary{background:#fff;color:var(--accent-dark);border:1px solid var(--line);box-shadow:none}
.btn:disabled{cursor:not-allowed;transform:none}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.backlink{margin-bottom:18px}
.landing-wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px}
.side-visual{overflow:hidden;min-height:520px;position:relative;background:linear-gradient(160deg,var(--accent-light),#F7FBFD)}
.side-visual img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.side-visual::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(180deg,transparent,rgba(11,35,49,.7))}
.side-visual .label{position:absolute;z-index:2;left:28px;right:28px;bottom:28px;color:white;font-size:19px;line-height:1.35}.side-visual .label strong{font-size:32px;letter-spacing:-.04em}
.landing-card{padding:48px;display:flex;flex-direction:column;justify-content:center;min-height:520px}
.scale-note{padding:14px 16px;background:var(--soft);border-radius:14px;color:var(--accent-dark);font-size:14px;line-height:1.5;margin:8px 0 22px}.scale-note strong{font-weight:900}
.progress-layout{display:grid;grid-template-columns:285px 1fr;gap:22px}
.sidebar{padding:24px;position:sticky;top:18px;align-self:start}.sidebar h3{font-size:18px;line-height:1.35;margin:9px 0 14px}
.progress-track{height:8px;border-radius:999px;background:#E8EFF3;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--accent);transition:width .2s ease}
.steps{display:grid;gap:7px;margin-top:18px}.step{display:flex;gap:9px;align-items:center;color:#8A99A5;font-size:12px;font-weight:800;line-height:1.2}.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#EFF4F7;color:#6E7E8A;font-size:11px}.step.active{color:var(--accent-dark)}.step.active .dot{background:var(--accent-dark);color:#fff}.step.done .dot{background:var(--accent-light);color:var(--accent-dark)}
.question-card{padding:40px;min-height:500px;display:flex;flex-direction:column}.category-tag{display:inline-flex;align-self:flex-start;background:var(--soft);color:var(--accent-dark);font-size:12px;font-weight:900;padding:8px 11px;border-radius:999px}.qnum{color:var(--muted);font-size:13px;font-weight:800;margin:22px 0 8px}.qtext{font-size:clamp(25px,3vw,36px);line-height:1.22;font-weight:850;letter-spacing:-.025em;max-width:850px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:30px}.scale button{border:1px solid var(--line);background:#fff;color:var(--accent-dark);font-weight:900;min-height:52px;border-radius:12px;cursor:pointer;transition:.15s ease}.scale button:hover{border-color:#C94F10;background:#C94F10;color:#fff;box-shadow:0 8px 22px rgba(201,79,16,.22)}.scale button.selected{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff;box-shadow:0 8px 22px rgba(24,63,86,.18)}
.scale-labels{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;font-weight:700;margin-top:9px}.nav{display:flex;justify-content:space-between;gap:12px;margin-top:auto;padding-top:34px}
.results-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.results-card,.radar-wrap{padding:30px}.results-card h2{font-size:42px}.score-list{display:grid;gap:12px;margin-top:20px}.score-row{display:grid;grid-template-columns:1fr 70px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid #EDF2F5}.score-row:last-child{border-bottom:0}.score-row strong{color:var(--accent-dark)}.bar{height:8px;background:#EDF2F5;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}.score-val{text-align:right;color:var(--muted)}.radar-wrap{display:grid;place-items:center;min-height:560px}#radar{width:100%;height:auto;max-width:680px}
.report-note{font-size:12px;color:var(--muted);margin:18px 0 0;line-height:1.5}
.reflection-card{margin-top:22px;padding:28px}.reflection-card h3{font-size:22px;line-height:1.25;margin:0 0 14px}.reflection-card textarea{width:100%;min-height:150px;resize:vertical;border:1px solid #C8D4DB;border-radius:14px;padding:16px;font:inherit;line-height:1.55;color:var(--ink);background:#fff;outline:none;transition:.2s}.reflection-card textarea:focus{border-color:var(--accent-dark);box-shadow:0 0 0 3px rgba(24,63,86,.08)}.reflection-actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}.send-status{font-size:13px;color:var(--muted);line-height:1.4;max-width:720px}.send-status.ok{color:#2F6B52}.send-status.warn{color:#8A5A13}
.capability-card{padding:28px;margin-top:22px}
.capability-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:18px}
.capability-title{font-size:34px;line-height:1.05;letter-spacing:-.03em;margin:0 0 8px}
.capability-intro{margin:0;color:var(--muted);max-width:760px}
.capability-badge{width:100px;height:100px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:conic-gradient(#F36B21 0 var(--overall-pct,0%),#E7EEF2 var(--overall-pct,0%) 100%);position:relative;color:var(--ink);font-weight:900;font-size:27px}
.capability-badge:before{content:"";position:absolute;inset:10px;border-radius:50%;background:#fff}.capability-badge span{position:relative;z-index:1}
.signal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.signal-item{padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}
.signal-kicker{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.signal-label{font-size:18px;font-weight:900;margin-bottom:10px}
.signal-value{font-size:14px;font-weight:800;color:var(--muted);margin-top:8px;text-align:right}
.signal-bar{height:12px;background:#E8EEF2;border-radius:999px;overflow:hidden}.signal-bar>i{display:block;height:100%;background:#F36B21;border-radius:999px}
.priority-flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;background:#FAF7F5;border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:18px}
.flow-step{padding:14px 16px;border-radius:16px;background:#EAF0F3;text-align:center;font-weight:900;color:var(--ink)}.flow-step.active{background:#F5DCCE;color:#9F4318}.flow-arrow{text-align:center;font-size:28px;color:var(--muted);font-weight:900}
.reflection-block{margin-top:20px}.reflection-block label{display:block;font-size:16px;font-weight:900;margin-bottom:8px}.reflection-helper{font-size:14px;margin:0 0 10px;color:var(--muted)}.reflection-input{width:100%;min-height:160px;resize:vertical;border:1px solid #C8D4DB;border-radius:14px;padding:16px;font:inherit;line-height:1.55;color:var(--ink);background:#fff;outline:none;transition:.2s}.reflection-input:focus{border-color:var(--accent-dark);box-shadow:0 0 0 3px rgba(24,63,86,.08)}
@media(max-width:900px){.shell{padding:16px}.landing-wrap,.progress-layout,.results-grid{grid-template-columns:1fr}.signal-grid{grid-template-columns:1fr}.capability-header{align-items:center}.priority-flow{grid-template-columns:1fr;gap:8px}.flow-arrow{transform:rotate(90deg)}.side-visual{min-height:340px}.landing-card{min-height:auto;padding:32px}.sidebar{position:relative;top:auto}.steps{grid-template-columns:repeat(2,1fr)}.question-card{padding:28px}.scale{grid-template-columns:repeat(5,1fr)}.radar-wrap{min-height:420px}.results-card h2{font-size:34px}}

@media(max-width:560px){.topbar{margin-bottom:16px}.top-actions{gap:6px}.brand{font-size:18px}.mark{width:34px;height:34px}.landing-card{padding:26px}.side-visual .label{left:20px;right:20px;bottom:20px}.side-visual .label strong{font-size:26px}.steps{grid-template-columns:1fr}.qtext{font-size:25px}.scale{grid-template-columns:repeat(5,1fr)}.scale button{min-height:48px}.nav{flex-direction:column-reverse}.nav .btn{width:100%}.actions.backlink .btn{flex:1}.results-card,.radar-wrap{padding:22px}}
@media print{
  body{background:#fff}.shell{max-width:none;padding:0}.topbar,.backlink,#landing,#survey,.reflection-actions{display:none!important}.screen{display:none!important}#results{display:block!important}.results-grid{grid-template-columns:1fr 1fr;gap:14px}.card{box-shadow:none;border:1px solid #D9E3E9}.results-card,.radar-wrap{padding:20px}.radar-wrap{min-height:430px}#radar{max-width:580px}.score-row{break-inside:avoid}
}
</style>
</head>

function wrapPdfText(ctx,text,maxWidth,size=22,weight=500){
  ctx.font=`${weight} ${size}px Arial, sans-serif`;

  paras.forEach(p=>{if(!p){lines.push('');return}const words=p.split(/\s+/);let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth||!line){line=test}else{lines.push(line);line=word}}if(line)lines.push(line)});
  return lines;
}
function fitPdfLines(ctx,text,maxWidth,maxHeight,startSize=24,minSize=10,lineRatio=1.25){
  for(let s=startSize;s>=minSize;s--){const lines=wrapPdfText(ctx,text,maxWidth,s,500),lh=s*lineRatio;if(lines.length*lh<=maxHeight)return {size:s,lines,lh}}
  const s=minSize,lh=s*lineRatio,lines=wrapPdfText(ctx,text,maxWidth,s,500),maxLines=Math.max(1,Math.floor(maxHeight/lh));
  if(lines.length>maxLines){lines.length=maxLines;lines[maxLines-1]=lines[maxLines-1].replace(/\s*$/,'')+'…'}
  return {size:s,lines,lh};
}
function jpegToSinglePagePdf(jpg,width,height){
  const enc=new TextEncoder(),chunks=[];let len=0;const offsets=[0];
  const pushText=s=>{const b=enc.encode(s);chunks.push(b);len+=b.length};
  const pushBytes=b=>{chunks.push(b);len+=b.length};
  const obj=(id,body)=>{offsets[id]=len;pushText(`${id} 0 obj\n${body}\nendobj\n`)};
  pushText('%PDF-1.4\n');
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 841.89 595.28] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offsets[4]=len;pushText(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${width} /Height ${height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);pushBytes(jpg);pushText('\nendstream\nendobj\n');
  const content='q\n841.89 0 0 595.28 0 0 cm\n/Im0 Do\nQ\n';
  obj(5,`<< /Length ${enc.encode(content).length} >>\nstream\n${content}endstream`);
  const xref=len;pushText('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)pushText(String(offsets[i]).padStart(10,'0')+' 00000 n \n');pushText(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  const out=new Uint8Array(len);let pos=0;for(const c of chunks){out.set(c,pos);pos+=c.length}return out;
}

}

function drawRadar(scores,labels){
  const cv=$('radar'),ctx=cv.getContext('2d'),w=cv.width,h=cv.height,cx=w/2,cy=h/2,r=145,n=labels.length;
  ctx.clearRect(0,0,w,h);ctx.font='600 12px Inter, sans-serif';ctx.textBaseline='middle';
  for(let ring=2;ring<=10;ring+=2){
    ctx.beginPath();
    for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n,rr=r*ring/10,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.closePath();ctx.strokeStyle='#D9E3E9';ctx.lineWidth=1;ctx.stroke();
  }
  function wrapLabel(text,maxChars){const words=text.split(' '),lines=[];let line='';words.forEach(word=>{const test=line?line+' '+word:word;if(test.length>maxChars&&line){lines.push(line);line=word}else line=test});if(line)lines.push(line);return lines}
  for(let i=0;i<n;i++){
    let a=-Math.PI/2+i*2*Math.PI/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.strokeStyle='#E3E9ED';ctx.stroke();
    let lx=cx+Math.cos(a)*(r+58),ly=cy+Math.sin(a)*(r+58),lines=wrapLabel(labels[i],22),cos=Math.cos(a);
    ctx.textAlign=Math.abs(cos)<0.25?'center':(cos>0?'left':'right');ctx.fillStyle='#4F6270';
    const lineHeight=15,y0=ly-((lines.length-1)*lineHeight/2);lines.forEach((line,j)=>ctx.fillText(line,lx,y0+j*lineHeight));
  }
  ctx.beginPath();scores.forEach((s,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,rr=r*s/10,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle='rgba(47,107,138,.18)';ctx.fill();ctx.strokeStyle='#183F56';ctx.lineWidth=3;ctx.stroke();
  scores.forEach((s,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,rr=r*s/10,x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle='#183F56';ctx.fill()});
}
