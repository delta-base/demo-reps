# Rendered by the nginx image's envsubst step (it is copied in as a
# template), so ${ELEVENLABS_...} below come from breakthrough-client/.env.
# Only variables that are set in the environment are substituted, so nginx's
# own $uri etc. are left alone.

# Signed URLs cost ElevenLabs minutes once used: a few per minute per visitor.
limit_req_zone $binary_remote_addr zone=voice_signed:1m rate=6r/m;

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Short-lived signed URL for a private ElevenLabs agent (what the repo's
    # voice-server.mjs does, done here so the site stays plain nginx). The API
    # key is added on this side and never sent to the browser.
    location = /api/voice/signed-url {
        limit_req zone=voice_signed burst=3 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }
        proxy_pass https://api.elevenlabs.io/v1/convai/conversation/get-signed-url?agent_id=${ELEVENLABS_AGENT_ID};
        proxy_set_header xi-api-key "${ELEVENLABS_API_KEY}";
        proxy_set_header Host api.elevenlabs.io;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "no-store" always;
    }

    # ── Local voice engine (voice-local service), for testing ────────────────
    # The demo pages import ElevenLabs' browser SDK from a CDN; these rewrite
    # that import to a drop-in (voice-local/static/elevenlabs-shim.js) which
    # uses the real SDK unless a tester has picked the local engine, and add
    # the tester-only engine switch. If the pages ever pin another SDK
    # version the rewrite simply stops matching and they use ElevenLabs.
    location = /pitch-voice.js {
        sub_filter_types application/javascript text/javascript;
        sub_filter "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm" "/voice-local/elevenlabs-shim.js";
        sub_filter_once on;
        try_files $uri =404;
    }
    location ~ ^/(demo|voice)\.html$ {
        sub_filter "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.26.0/+esm" "/voice-local/elevenlabs-shim.js";
        # ?v= changes whenever switch.js changes, so browsers never keep a stale copy.
        sub_filter "</body>" "<script src=\"/voice-local/switch.js?v=2\" defer></script></body>";
        sub_filter_once on;
        try_files $uri =404;
    }
    # The service itself. Resolved per request (Docker DNS), so this site still
    # starts when voice-local is not running — the switch then just fails over
    # to a clear error on the local engine only.
    location /voice-local/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $voice_local http://voice-local:8000;
        proxy_pass $voice_local;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 1300s;
        proxy_send_timeout 1300s;
        # Test code that changes often: browsers must revalidate every time
        # (a cached switch.js from before a fix looked like the fix had failed).
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles, even if one slips past the dockerignore.
    # First regex location, so it wins over the .mhtml rule below.
    location ~ /\. {
        deny all;
    }

    # The legal pages are saved-from-browser .mhtml files, unknown to nginx.
    location ~ \.mhtml$ {
        default_type message/rfc822;
    }
}
